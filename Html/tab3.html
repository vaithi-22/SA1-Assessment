<div class="tab3">
    <!-- tab3.html -->
    <h1 style="color: brown; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-weight: bold;">Contact :</h1>
         <h3 style="color: blue;">Enter your contact details:</h3>
        <form id="contactForm">
          <div class="form-group">
            <label>Name:</label>
            <input type="text" id="name" placeholder="john" required />
          </div><br>
          <div class="form-group">
            <label>Email:</label>
            <input type="email" id="email" placeholder="john@sample.com" required />
          </div><br>
          <div class="form-group">
            <label>Phone Number:</label>
            <input type="phone" id="phone" placeholder="+00 12345678" required />
          </div><br>
          <div class="form-group">
            <label>Message:</label>
            <textarea id="message" rows="4" placeholder="enter your message" required></textarea>
          </div><br>
          <button class="btn btn-secondary m-2 " type="reset">Reset</button>
          <button type="submit" class="btn btn-primary m-2">Submit</button>
          <p id="responseMsg"></p>
        </form>

</div>
